{% extends 'base.html' %}

{% block content %}
<div class="page-header">
    <h2><i class="fas fa-plus-circle"></i> Add New Asset</h2>
    <p>Enter asset details for corrosion risk analysis</p>
</div>

<div class="form-container">
    <form method="POST">
        <div class="form-row">
            <div class="form-group">
                <label><i class="fas fa-tag"></i> Asset Name</label>
                <input type="text" name="asset" placeholder="e.g., Main Gate" required>
            </div>
            <div class="form-group">
                <label><i class="fas fa-cube"></i> Material</label>
                <select name="material">
                    <option value="Iron">Iron</option>
                    <option value="Steel">Steel</option>
                    <option value="Aluminium">Aluminium</option>
                    <option value="Copper">Copper</option>
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label><i class="fas fa-globe"></i> Environment</label>
                <select name="environment">
                    <option value="Coastal">🌊 Coastal</option>
                    <option value="Rainy">☔ Rainy</option>
                    <option value="Industrial">🏭 Industrial</option>
                    <option value="Indoor">🏠 Indoor</option>
                </select>
            </div>
            <div class="form-group">
                <label><i class="fas fa-clock"></i> Age (Years)</label>
                <input type="number" name="age" placeholder="e.g., 5" required>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label><i class="fas fa-ruler-horizontal"></i> Length (cm)</label>
                <input type="number" name="length" placeholder="e.g., 200" required>
            </div>
            <div class="form-group">
                <label><i class="fas fa-ruler-vertical"></i> Width (cm)</label>
                <input type="number" name="width" placeholder="e.g., 150" required>
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-save"></i> Save Asset
            </button>
            <a href="/assets" class="btn btn-secondary">
                <i class="fas fa-times"></i> Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}
